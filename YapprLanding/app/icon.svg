<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yappr">
  <!--
    The favicon: one letterform, not the wordmark.

    The previous version set "Yappr" inside the circle. It was legible at
    64px and mush at the sizes a favicon is actually drawn — 16px in a
    tab, 32px on a retina tab. Five letters across 16 pixels gives about
    three pixels per letter. One letter at a legible size beats five at
    an illegible one, and the tab strip is the one place the mark has to
    survive being tiny.

    SQUARE, matching the footer mark and the Dock icon at 22 percent
    corner radius, so the three read as one object. The circle it
    replaced was chosen when the wordmark was still inside: a circle
    wastes its corners, which is affordable for five letters set small
    and wasteful for one set large.

    Georgia italic, not Instrument Serif: favicons render before any
    webfont is available and cannot load one, so naming Instrument Serif
    would silently fall back to whatever the OS picks. Georgia is on
    effectively every machine and is the closest widely installed match.

    Mirrors the "plate-radial" custom property in globals.css (written
    without its leading dashes: XML forbids a double hyphen inside a
    comment, and the browser refuses to render the whole file).
  -->
  <defs>
    <radialGradient id="y-plate" cx="0.5" cy="0.5" r="0.62">
      <stop offset="0"    stop-color="#16305C" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#16305C" stop-opacity="0"/>
      <stop offset="0.24" stop-color="#1C3660" stop-opacity="0.14"/>
      <stop offset="0.38" stop-color="#284676" stop-opacity="0.29"/>
      <stop offset="0.52" stop-color="#365A96" stop-opacity="0.46"/>
      <stop offset="0.66" stop-color="#446EB6" stop-opacity="0.62"/>
      <stop offset="0.82" stop-color="#507ED0" stop-opacity="0.76"/>
      <stop offset="1"    stop-color="#5A8FE8" stop-opacity="0.88"/>
    </radialGradient>
    <linearGradient id="y-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Graphite ink, not black: the same easing-off that cut the mark's
       contrast on the page. -->
  <rect width="64" height="64" rx="14" ry="14" fill="#151B26"/>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#y-plate)"/>
  <rect width="64" height="64" rx="14" ry="14" fill="url(#y-sheen)"/>

  <!-- Skewed rather than font-style="italic": sips ignores font-style and
       rasterises roman, and this file is the source for favicon.ico. The
       translate cancels the skew's drift, which at y=32 with a=-11 is
       32*tan(11) = 6.2. -->
  <g transform="translate(6.2,0) skewX(-11)">
    <text
      x="32" y="33"
      text-anchor="middle"
      dominant-baseline="central"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="47"
      fill="#FFFFFF"
    >Y</text>
  </g>
</svg>
